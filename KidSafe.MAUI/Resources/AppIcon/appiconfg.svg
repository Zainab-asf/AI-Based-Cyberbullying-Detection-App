<?xml version="1.0" encoding="UTF-8"?>
<!--
  KidSafe launcher icon — foreground layer.
  Flat solid colours only: #9BB53E #775496 #B09FCA #3D2460 #1C0C3F #FFFFFF
  Canvas 456×456, mascot face centred in the inner safe zone.
-->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">

  <!-- ── Helmet dome (Deep Lavender) ── -->
  <ellipse cx="228" cy="190" rx="128" ry="138" fill="#775496"/>

  <!-- Helmet top spike (Purple Rose — one shade lighter, still solid) -->
  <path d="M 228 52 C 212 52 198 66 198 84 L 207 120 Q 228 112 249 120 L 258 84 C 258 66 244 52 228 52 Z"
        fill="#B09FCA"/>

  <!-- Ear bumps (Macaw Green) -->
  <ellipse cx="112" cy="212" rx="28" ry="24" fill="#9BB53E"/>
  <ellipse cx="344" cy="212" rx="28" ry="24" fill="#9BB53E"/>

  <!-- Dark visor -->
  <rect x="150" y="150" width="156" height="108" rx="26" fill="#1C0C3F"/>

  <!-- Left eye white -->
  <circle cx="194" cy="200" r="21" fill="#B09FCA"/>
  <circle cx="196" cy="197" r="10" fill="white"/>
  <circle cx="198" cy="197" r="5"  fill="#3D2460"/>
  <circle cx="202" cy="193" r="2"  fill="white"/>

  <!-- Right eye — wink (flat arc, no fill) -->
  <circle cx="262" cy="200" r="21" fill="#B09FCA"/>
  <path d="M 243 196 Q 262 183 281 196" stroke="white" stroke-width="5"
        stroke-linecap="round" fill="none"/>

  <!-- Smile -->
  <path d="M 190 232 Q 228 252 266 232" stroke="white" stroke-width="5"
        stroke-linecap="round" fill="none"/>

  <!-- Body (Macaw Green) -->
  <rect x="150" y="292" width="156" height="96" rx="28" fill="#9BB53E"/>

  <!-- Shield on chest (Deep Lavender outline → Purple Rose fill) -->
  <path d="M 228 304 L 208 312 L 208 330 Q 208 346 228 352 Q 248 346 248 330 L 248 312 Z"
        fill="#3D2460"/>
  <path d="M 228 308 L 212 315 L 212 330 Q 212 344 228 349 Q 244 344 244 330 L 244 315 Z"
        fill="#775496"/>

  <!-- Checkmark on shield -->
  <path d="M 220 329 L 226 335 L 239 319" stroke="white" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

</svg>
